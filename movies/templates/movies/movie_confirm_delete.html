{% extends 'movies/base.html' %}

{% block title %}Delete Movie{% endblock %}

{% block content %}
<h1>Delete Movie</h1>

<div style="background: #fff3cd; padding: 20px; border-radius: 5px; border-left: 4px solid #ffc107; margin: 20px 0;">
    <p><strong>Are you sure you want to delete "{{ movie.title }}"?</strong></p>
    <p>This action cannot be undone.</p>
</div>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'movie_detail' movie.pk %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
