{% extends 'movies/base.html' %}

{% block title %}{% if movie %}Edit Movie{% else %}Add New Movie{% endif %}{% endblock %}

{% block content %}
<h1>{% if movie %}Edit Movie{% else %}Add New Movie{% endif %}</h1>

<form method="post" style="max-width: 600px;">
    {% csrf_token %}
    
    <div style="margin-bottom: 15px;">
        <label for="title" style="display: block; margin-bottom: 5px;"><strong>Title:</strong></label>
        <input type="text" id="title" name="title" value="{{ movie.title|default:'' }}" required 
               style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
    </div>
    
    <div style="margin-bottom: 15px;">
        <label for="director" style="display: block; margin-bottom: 5px;"><strong>Director:</strong></label>
        <input type="text" id="director" name="director" value="{{ movie.director|default:'' }}" required 
               style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
    </div>
    
    <div style="margin-bottom: 15px;">
        <label for="genre" style="display: block; margin-bottom: 5px;"><strong>Genre:</strong></label>
        <input type="text" id="genre" name="genre" value="{{ movie.genre|default:'' }}" required 
               style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
    </div>
    
    <div style="margin-bottom: 15px;">
        <label for="year" style="display: block; margin-bottom: 5px;"><strong>Year:</strong></label>
        <input type="number" id="year" name="year" value="{{ movie.year|default:'' }}" required 
               style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
    </div>
    
    <div style="margin-bottom: 15px;">
        <label for="rating" style="display: block; margin-bottom: 5px;"><strong>Rating (0-10):</strong></label>
        <input type="number" step="0.1" min="0" max="10" id="rating" name="rating" 
               value="{{ movie.rating|default:'0.0' }}" required 
               style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
    </div>
    
    <div style="margin-bottom: 15px;">
        <label for="duration" style="display: block; margin-bottom: 5px;"><strong>Duration (minutes):</strong></label>
        <input type="number" id="duration" name="duration" value="{{ movie.duration|default:'' }}" required 
               style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
    </div>
    
    <div style="margin-bottom: 15px;">
        <label for="description" style="display: block; margin-bottom: 5px;"><strong>Description:</strong></label>
        <textarea id="description" name="description" rows="4" 
                  style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">{{ movie.description|default:'' }}</textarea>
    </div>
    
    <div>
        <button type="submit" class="btn">Save</button>
        <a href="{% url 'movie_list' %}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
